services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analysim}
      POSTGRES_USER: ${POSTGRES_USER:-analysim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-long-random-password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ${ANALYSIM_DATA_ROOT:-./data}/postgres/data:/var/lib/postgresql/data
      - ${ANALYSIM_DATA_ROOT:-./data}/postgres/certs:/etc/postgresql/certs:ro
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migration:
    image: analysim-migration:${ANALYSIM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      target: migration
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ClientApp__ServeFromBackend: "false"
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      AdminUsers__0: ${ADMIN_USER:-ADMIN}
      registrationCodes__0: ${REGISTRATION_CODE:-replace-with-registration-code}
      ConnectionStrings__DBConnectionString: ${DB_CONNECTION_STRING:-User ID=analysim;Password=replace-with-a-long-random-password;Server=postgres;Port=5432;Database=analysim;Pooling=true;SSL Mode=Require;Trust Server Certificate=true}
      JwtSettings__Issuer: ${JWT_ISSUER:-AnalySim}
      JwtSettings__Audience: ${JWT_AUDIENCE:-https://localhost}
      JwtSettings__Secret: ${JWT_SECRET:-replace-with-a-long-random-secret}
      ClientSettings__BaseUrl: ${CLIENT_BASE_URL:-https://localhost}
      EmailSettings__Server: ${EMAIL_SERVER:-smtp.example.com}
      EmailSettings__Port: ${EMAIL_PORT:-587}
      EmailSettings__SenderName: ${EMAIL_SENDER_NAME:-no-reply-analysim}
      EmailSettings__SenderEmail: ${EMAIL_SENDER_EMAIL:-no-reply@example.com}
      EmailSettings__Username: ${EMAIL_USERNAME:-replace-with-email-username}
      EmailSettings__Password: ${EMAIL_PASSWORD:-replace-with-email-password}
      UserQuota: ${USER_QUOTA:-100000000}
    volumes:
      - ${ANALYSIM_DATA_ROOT:-./data}/postgres/certs:/app/certs/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: analysim-backend:${ANALYSIM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ClientApp__ServeFromBackend: "false"
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      AdminUsers__0: ${ADMIN_USER:-ADMIN}
      registrationCodes__0: ${REGISTRATION_CODE:-replace-with-registration-code}
      ConnectionStrings__DBConnectionString: ${DB_CONNECTION_STRING:-User ID=analysim;Password=replace-with-a-long-random-password;Server=postgres;Port=5432;Database=analysim;Pooling=true;SSL Mode=Require;Trust Server Certificate=true}
      JwtSettings__Issuer: ${JWT_ISSUER:-AnalySim}
      JwtSettings__Audience: ${JWT_AUDIENCE:-https://localhost}
      JwtSettings__Secret: ${JWT_SECRET:-replace-with-a-long-random-secret}
      ClientSettings__BaseUrl: ${CLIENT_BASE_URL:-https://localhost}
      EmailSettings__Server: ${EMAIL_SERVER:-smtp.example.com}
      EmailSettings__Port: ${EMAIL_PORT:-587}
      EmailSettings__SenderName: ${EMAIL_SENDER_NAME:-no-reply-analysim}
      EmailSettings__SenderEmail: ${EMAIL_SENDER_EMAIL:-no-reply@example.com}
      EmailSettings__Username: ${EMAIL_USERNAME:-replace-with-email-username}
      EmailSettings__Password: ${EMAIL_PASSWORD:-replace-with-email-password}
      UserQuota: ${USER_QUOTA:-100000000}
    expose:
      - "8080"
    volumes:
      - ${ANALYSIM_DATA_ROOT:-./data}/postgres/certs:/app/certs/postgres:ro
    depends_on:
      migration:
        condition: service_completed_successfully

  nginx:
    image: analysim-nginx:${ANALYSIM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    environment:
      ANALYSIM_DOMAIN: ${ANALYSIM_DOMAIN:-localhost}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/letsencrypt/live/localhost/fullchain.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/letsencrypt/live/localhost/privkey.pem}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${ANALYSIM_DATA_ROOT:-./data}/certbot/conf:/etc/letsencrypt:ro
      - ${ANALYSIM_DATA_ROOT:-./data}/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started

  backup:
    image: analysim-backup:${ANALYSIM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analysim}
      POSTGRES_USER: ${POSTGRES_USER:-analysim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-long-random-password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /backups/postgres
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${ANALYSIM_DATA_ROOT:-./data}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ${ANALYSIM_DATA_ROOT:-./data}/certbot/conf:/etc/letsencrypt
      - ${ANALYSIM_DATA_ROOT:-./data}/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done
