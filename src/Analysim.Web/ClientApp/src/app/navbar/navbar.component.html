<!-- Nav Bar Start -->
<nav class="navbar navbar-dark bg-shell navbar-body">
  <button
    class="sidebar-toggle"
    [class.is-open]="isMenuOpen"
    type="button"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="navbarSectionMenu"
    aria-label="Toggle navigation"
    (click)="toggleMenu()"
  >
    <i class="fa fa-bars" aria-hidden="true"></i>
  </button>

  <a class="navbar-brand" (click)="navigateHome()" aria-label="AnalySim home">
    <img src="../../assets/img/AnalySim-Title.png" alt="AnalySim" />
  </a>

  <span class="section-divider" aria-hidden="true"></span>
  <span class="section-title">{{ sectionTitle }}</span>

  <div class="nav-spacer"></div>

  <div class="nav-actions">
    <form class="nav-search" (ngSubmit)="onSubmit()" role="search">
      <label class="search-group">
        <span class="search-icon">
          <i class="fa fa-search" aria-hidden="true"></i>
        </span>
        <input
          type="text"
          placeholder="Search"
          name="searchTerm"
          [(ngModel)]="searchText"
          aria-label="Search projects"
        />
      </label>
    </form>

    <ul class="navbar-nav right-nav" *ngIf="!(loginStatus$ | async)">
      <li class="nav-item">
        <a class="nav-link nav-interactive" [routerLink]="['/login']">Login</a>
      </li>
      <li class="nav-item">
        <a class="nav-link nav-interactive" [routerLink]="['/register']">Register</a>
      </li>
    </ul>

    <ul
      class="navbar-nav right-nav align-items-center"
      *ngIf="(loginStatus$ | async)"
    >
      <li class="nav-item compact-link" *ngIf="(isAdmin$ | async)">
        <a
          class="nav-link nav-interactive"
          routerLink="/admin"
          title="Admin"
          (click)="closeMenus()"
        >
          <i class="fa fa-cogs"></i>
        </a>
      </li>

      <li
        class="nav-item profile-menu-host"
        *ngIf="(currentUser$ | async) as currentUser"
      >
        <button
          class="nav-profile-trigger"
          type="button"
          [class.is-open]="isProfileMenuOpen"
          [attr.aria-expanded]="isProfileMenuOpen"
          aria-controls="profileMenu"
          title="Profile"
          (click)="toggleProfileMenu()"
        >
          <img
            [src]="profileImageUrl"
            class="nav-avatar rounded-circle"
            alt="Profile"
          />
        </button>

        <div id="profileMenu" class="profile-menu" *ngIf="isProfileMenuOpen">
          <a
            class="profile-menu-link"
            [routerLink]='["/profile/" + currentUser.userName]'
            (click)="closeMenus()"
          >View Profile</a>
          <a
            class="profile-menu-link"
            [routerLink]='["/setting/profile"]'
            (click)="closeMenus()"
          >Settings</a>
          <button
            class="profile-menu-link profile-menu-button"
            type="button"
            (click)="onLogout()"
          >Log out</button>
        </div>
      </li>
    </ul>
  </div>

  <button
    class="nav-drawer-backdrop"
    type="button"
    aria-label="Close navigation menu"
    *ngIf="isMenuOpen"
    (click)="closeMenu()"
  ></button>

  <aside
    id="navbarSectionMenu"
    class="nav-drawer"
    *ngIf="isMenuOpen"
    aria-label="Navigation menu"
  >
    <div class="drawer-header">
      <span>AnalySim</span>
      <button
        class="drawer-close"
        type="button"
        aria-label="Close navigation menu"
        (click)="closeMenu()"
      >
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <div class="drawer-list" role="navigation" aria-label="Main links">
      <a class="drawer-link" [routerLink]="['/home']" (click)="closeMenus()">
        <i class="fa fa-home" aria-hidden="true"></i>
        Home
      </a>
      <a class="drawer-link" [routerLink]="['/explore']" (click)="closeMenus()">
        <i class="fa fa-compass" aria-hidden="true"></i>
        Explore
      </a>
      <a
        class="drawer-link"
        [routerLink]="['/dashboard']"
        *ngIf="(loginStatus$ | async)"
        (click)="closeMenus()"
      >
        <i class="fa fa-chart-line" aria-hidden="true"></i>
        Dashboard
      </a>
      <a
        class="drawer-link"
        [routerLink]="['/project/create']"
        *ngIf="(loginStatus$ | async)"
        (click)="closeMenus()"
      >
        <i class="fa fa-plus" aria-hidden="true"></i>
        New Project
      </a>
      <a
        class="drawer-link"
        [routerLink]="['/setting/profile']"
        *ngIf="(loginStatus$ | async)"
        (click)="closeMenus()"
      >
        <i class="fa fa-cog" aria-hidden="true"></i>
        Settings
      </a>
      <a
        class="drawer-link"
        [routerLink]="['/admin']"
        *ngIf="(isAdmin$ | async)"
        (click)="closeMenus()"
      >
        <i class="fa fa-cogs" aria-hidden="true"></i>
        Admin
      </a>
      <a
        class="drawer-link"
        [routerLink]="['/login']"
        *ngIf="!(loginStatus$ | async)"
        (click)="closeMenus()"
      >
        <i class="fa fa-sign-in-alt" aria-hidden="true"></i>
        Login
      </a>
      <a
        class="drawer-link"
        [routerLink]="['/register']"
        *ngIf="!(loginStatus$ | async)"
        (click)="closeMenus()"
      >
        <i class="fa fa-user-plus" aria-hidden="true"></i>
        Register
      </a>
    </div>

    <div class="drawer-footer" *ngIf="(currentUser$ | async) as currentUser">
      <a
        class="drawer-link"
        [routerLink]='["/profile/" + currentUser.userName]'
        (click)="closeMenus()"
      >
        <img [src]="profileImageUrl" class="drawer-avatar" alt="Profile" />
        View Profile
      </a>
    </div>
  </aside>
</nav>
