<div class="modal-header modal-header--center">
  <h5 class="modal-title">Create Folder</h5>

  <button type="button" class="close" (click)="closeModal.emit()" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<form [formGroup]="folderForm" (ngSubmit)="onSubmit()">
  <div class="modal-body">
    <div class="form-group">
      <label for="folderName">Folder Name:</label>

      <input
        id="folderName"
        formControlName="folderName"
        type="text"
        class="form-control"
        [class.invalid]="folderName.touched && folderName.invalid"
        [class.valid]="folderName.touched && folderName.valid"
        [readOnly]="isLoading"
        required
      />

      <div *ngIf="folderName.touched && folderName.errors" class="text-danger">
        <span *ngIf="folderName.errors?.['minlength']">Minimum 1 character</span>
        <span *ngIf="folderName.errors?.['maxlength']">Maximum 20 characters</span>
        <span *ngIf="folderName.errors?.['noMatch']">Folder already exists</span>
        <span *ngIf="folderName.errors?.['noSpaceSpecial']">No spaces or special characters</span>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <!-- Secondary first -->
    <button type="button" class="btn btn-outline-primary" (click)="closeModal.emit()" [disabled]="isLoading">
      Close
    </button>

    <!-- Primary last -->
    <button type="submit" class="btn btn-primary" [disabled]="folderName.invalid || isLoading">
      <span *ngIf="!isLoading">Create</span>

      <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span *ngIf="isLoading" class="sr-only">Loading...</span>
    </button>
  </div>
</form>
