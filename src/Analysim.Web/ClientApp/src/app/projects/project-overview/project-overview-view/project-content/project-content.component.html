<div class="card notebooks-card">
    <div class="d-flex card-header flex-row align-items-center notebooks-card__header">
        <span class="mr-2">Notebooks</span>
        <div class="d-inline-flex ml-auto" *ngIf="!isCurrentDirNotebook">
            <!-- Private Button Group Start -->
            <div class="btn-group notebooks-card__actions" role="group" *ngIf="isMember" aria-label="Notebook creation actions">
                <button type="button" class="btn btn-primary" title="Upload Notebook" aria-label="Upload Notebook" (click)="toggleModalUpload()">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-outline-primary" title="Create Folder" aria-label="Create Folder" (click)="openFolderModal()">
                    <i class="fa fa-folder-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
    <ul class="list-group notebooks-card__list">
        <li class="list-group-item notebooks-card__list-item notebooks-card__nav-up" *ngIf="currentDirectory.split('/').length>2"
            (click)="navigateToPreviousComponent()"> . . . </li>
        <li class="list-group-item notebooks-card__list-item" *ngIf="(notebooks?.length ?? 0) === 0 && !isCurrentDirNotebook "> No Notebooks Found </li>
        <app-project-notebook-item *ngFor="let notebook of notebooks" [project]="project" [notebook]="notebook"
            [currentDirectory]="currentDirectory" (navigateToNewDirectory)="navigate($event)"
            (getNotebooks)="getNotebooks($event)" (setCurrentNotebook)="displayNotebook($event)"
            [isMember]="isMember"></app-project-notebook-item>
    </ul>
</div>

<ng-template #uploadNotebookModal>
    <app-modal-upload-notebook [project]="project" (getNotebooks)="getNotebooks($event)" (closeModal)="closeModal()"
        [currentDirectory]="currentDirectory"></app-modal-upload-notebook>
</ng-template>

<ng-template #folderModal>
    <app-modal-notebook-folder [project]="project" (getNotebooks)="getNotebooks($event)"
        (closeModal)="closeFolderModal()" [currentDirectory]="currentDirectory"></app-modal-notebook-folder>
</ng-template>

<ng-template #displayNotebookModal>
    <app-project-notebook-item-display [notebook]="currentNotebook" [version]="version" [isMember]="isMember"
        [projectName]="project?.name"
        (closeModal)="closeDisplayNotebookModal()"></app-project-notebook-item-display>
</ng-template>
