<div class="card">
  <div class="d-flex card-header flex-row align-items-center">
    <span class="">Publications</span>
    <div class="d-inline-flex ml-auto">
      <!-- Private Button Group Start -->
      <div class="btn-group" role="group">
        <button
          *ngIf="isMember"
          type="button"
          class="btn btn-primary btn-width"
          title="Add Publication"
          (click)="onAddPublication()"
          [disabled]="isLoading"
        >
          <i class="fa fa-plus"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="m-3">
    <div *ngIf="!isLoading && publications.length === 0">
      No publications yet.
    </div>

    <div *ngIf="!isLoading && publications.length > 0">
      <app-publication-item
        *ngFor="let publication of publications"
        [id]="publication.publicationID.toString()"
        [publication]="publication"
        [currentUser]="currentUser"
        [isMember]="isMember"
        (onReload)="loadPublications()"
      >
      </app-publication-item>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<ng-template #editModal>
  <app-modal-edit-publication
    [editModalRef]="editModalRef"
    [currentUser]="currentUser"
    [projectID]="project.projectID"
    (onSuccessfulEdit)="loadPublications()"
    (onCancelEdit)="this.isLoading = false"
  ></app-modal-edit-publication>
</ng-template>
