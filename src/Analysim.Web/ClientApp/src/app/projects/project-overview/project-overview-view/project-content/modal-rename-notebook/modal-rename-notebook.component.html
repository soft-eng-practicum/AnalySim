<div class="modal-header modal-header--center">
  <h5 class="modal-title">Rename Notebook</h5>

  <button type="button" class="close" (click)="closeModal.emit()" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<form [formGroup]="renameNotebookForm" (ngSubmit)="renameNotebook()">
  <div class="modal-body">
    <div class="form-group">
      <label for="notebookName">Notebook Name</label>

      <input
        id="notebookName"
        formControlName="notebookName"
        type="text"
        class="form-control"
        [class.invalid]="notebookName.touched && notebookName.invalid"
        [class.valid]="notebookName.touched && notebookName.valid"
        [readOnly]="isLoading"
        required
      />

      <div *ngIf="notebookName.touched && notebookName.errors" class="text-danger">
        <span *ngIf="notebookName.errors?.['minlength']">Minimum 1 character</span>
        <span *ngIf="notebookName.errors?.['maxlength']">Maximum 20 characters</span>
        <span *ngIf="notebookName.errors?.['noMatch']">Notebook name already exists</span>
        <span *ngIf="notebookName.errors?.['noSpaceSpecial']">No spaces or special characters</span>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <!-- Secondary -->
    <button type="button" class="btn btn-outline-primary" (click)="closeModal.emit()" [disabled]="isLoading">
      Close
    </button>

    <!-- Primary -->
    <button type="submit" class="btn btn-primary" [disabled]="notebookName.invalid || isLoading">
      Rename Notebook
    </button>
  </div>
</form>
