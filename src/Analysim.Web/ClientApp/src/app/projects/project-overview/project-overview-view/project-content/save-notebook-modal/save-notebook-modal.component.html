<div class="modal-background">
    <div class="modal-content">
        <p>Please make sure to save the notebook by pressing ctrl + S before committing changes !!</p>
        <div class="button-css">
            <button (click)="onConfirmSave()">
                <span *ngIf="!loading">commit changes</span>
                <span *ngIf="loading">committing..</span>
            </button>
            <button (click)="onCancelSave()">Cancel</button>
        </div>
    </div>
</div>
