<div class="comment-box">
  <textarea
    [placeholder]="placeholder"
    rows="3"
    class="form-control"
    [(ngModel)]="content"
  ></textarea>

  <div *ngIf="hasError != null" class="error-box">
    {{hasError}}
  </div>

  <div class="mt-2 text-end button-area">
    <button class="btn btn-outline-primary" (click)="onClear()">
      Cancel
    </button>

    <button class="btn btn-primary" (click)="onPost()">
      {{ isEditing ? "Update" : "Comment" }}
    </button>
  </div>
</div>
