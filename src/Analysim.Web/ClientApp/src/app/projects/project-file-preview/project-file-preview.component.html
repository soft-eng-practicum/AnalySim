<div class="card file-preview-card">
  <div class="d-flex card-header align-items-center file-preview-card__header">
    <div class="file-preview-card__title">
      <span class="file-preview-card__heading">Previewing</span>
      <span class="file-preview-card__filename">
        {{ blobFile?.name }}{{ blobFile?.extension }}
      </span>
    </div>

    <div class="ml-auto d-inline-flex">
      <div class="btn-group" role="group" aria-label="File preview actions">
        <button
          type="button"
          class="btn btn-primary"
          (click)="toggleModalObservablehq()"
          title="Analyze in Notebook"
          aria-label="Analyze in Notebook"
        >
          <i class="fa fa-play mr-1" aria-hidden="true"></i>
          Analyze in Notebook
        </button>
      </div>
    </div>
  </div>

  <div class="file-preview-card__body">
    <app-observablehq
      *ngIf="showNotebook"
      [blobUri]="blobFile.uri"
      [observableNotebookLink]="notebookLink"
    ></app-observablehq>
  </div>
</div>

<ng-template #observablehqModal>
  <app-modal-observablehq
    [observablehqModalRef]="observablehqModalRef"
    (loadNotebookEvent)="loadNotebook($event)"
  ></app-modal-observablehq>
</ng-template>
