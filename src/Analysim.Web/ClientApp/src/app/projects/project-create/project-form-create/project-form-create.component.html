<!-- Project Form Start -->
<form class="form" [formGroup]="projectForm" (ngSubmit)="onSubmit()" *ngIf="currentUser != null">

    <!-- Form Project Visibility -->
    <div class="form-group">
        <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" formControlName="visibility" id="inlineRadio1" value="public" [readOnly]="isLoading">
        <label class="form-check-label" for="inlineRadio1">Public</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" formControlName="visibility" id="inlineRadio2" value="private" [readOnly]="isLoading">
        <label class="form-check-label" for="inlineRadio2">Private</label>
      </div>
    </div>

    <!-- Form Project Name -->
    <div class="form-group">
        <label for="name">Project Name</label>
        <input formControlName="name" type="text" class="form-control" placeholder="" [class.invalid]="name.touched && name.invalid" [class.valid]="name.valid"  required  [readOnly]="isLoading">
        <div *ngIf="name.touched && name.errors" class="text-danger">
            <p class="mb-0 p-1" [hidden]="!name.errors?.['noSpaceSpecial']">No Space or Special Character Except Hyphen</p>
            <p class="mb-0 p-1" [hidden]="!name.errors?.['minlength']">Minimum 5 Character</p>
            <p class="mb-0 p-1" [hidden]="!name.errors?.['maxlength']">maximum 20 Character</p>
        </div>
    </div> 

    <!-- Form Description -->
    <div class="form-group">
        <label for="description">Description</label>
        <textarea formControlName="description" type="text" class="form-control" placeholder="" [readOnly]="isLoading"></textarea>
    </div>

    <fieldset class="member-permissions" formGroupName="memberPermissions" [disabled]="isLoading">
        <legend>Member Permissions</legend>
        <p class="text-muted mb-3">Choose what project members can do. As the owner, you always keep full access.</p>

        <div class="member-permission-option" *ngFor="let permission of permissionOptions">
            <div class="custom-control custom-switch">
                <input
                    type="checkbox"
                    class="custom-control-input"
                    [id]="'create-' + permission.key"
                    [formControlName]="permission.key">
                <label class="custom-control-label" [for]="'create-' + permission.key">
                    {{ permission.label }}
                </label>
            </div>
            <small class="text-muted d-block">{{ permission.description }}</small>
        </div>
    </fieldset>

    <!-- Form Create Project -->
    <div *ngIf="submitErrorMessage" class="form-group mb-2">
        <div class="alert alert-danger mb-0" role="alert">{{ submitErrorMessage }}</div>
    </div>

    <div class="form-group mb-0">
        <button id="success-btn"  type="submit" class="btn btn-success btn-block" value="Submit" [disabled]="projectForm.invalid || isLoading">
            <div *ngIf="!isLoading">
                <span>Create Project</span>
            </div>
            <div *ngIf="isLoading" class="spinner-border" role="status" >
                <span class="sr-only"></span>
            </div>
        </button>                
    </div>
</form> <!-- Project Form End -->
