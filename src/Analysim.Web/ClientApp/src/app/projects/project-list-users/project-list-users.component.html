<!-- User Card Start -->
<div class="card" *ngIf="projectUsers && projectUsers.length > 0">
    <!-- User List -->
    <div class="card-body p-3">
        <ul class="list-group">
            <app-project-user *ngFor="let projectUser of projectUsers; let lastItem = last" [class.mb-2]="!lastItem" [projectUser]="projectUser" (removedUser)="removeProjectUser($event)"></app-project-user>
        </ul>      
    </div>
</div> <!-- User Card End -->
