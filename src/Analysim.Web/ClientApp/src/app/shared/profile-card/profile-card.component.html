<div class="profile-card card" *ngIf="profile != undefined">
  <div class="profile-card__media">
    <img
      [src]="profileImageUrl"
      [alt]="profile.userName + ' profile image'"
      class="profile-card__image"
    />
  </div>

  <div class="profile-card__body">
    <div class="profile-card__header">
      <h5 class="profile-card__username mb-0">
        {{ profile.userName }}
      </h5>
    </div>

    <p class="profile-card__bio">
      {{ profile.bio || 'No bio added yet.' }}
    </p>

    <div class="profile-card__actions">
      <button
        type="button"
        class="btn btn-primary"
        *ngIf="currentUser == null || (currentUser != null && profile.id != currentUser.id)"
        (click)="!isFollowing ? followUser() : unFollowUser()"
      >
        {{ isFollowing ? 'Following' : 'Follow' }}
        <span class="profile-card__count">
          {{ profile.followers.length }}
        </span>
      </button>

      <a
        class="btn btn-outline-primary"
        [routerLink]="['/profile/' + profile.userName]"
      >
        View Profile
      </a>
    </div>
  </div>
</div>
