<div class="admin-login">
  <h2>Admin Login</h2>
  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        [(ngModel)]="username"
        name="username"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        class="form-control"
      />
    </div>

    <button type="submit" class="btn btn-primary">Log in</button>

    <div *ngIf="error" class="error mt-2">{{ error }}</div>
  </form>
</div>
