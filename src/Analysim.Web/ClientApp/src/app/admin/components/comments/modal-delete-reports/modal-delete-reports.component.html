<div class="modal-content">
  <div class="modal-header justify-content-center">
    <h5 class="modal-title">Delete Comment</h5>
  </div>

  <div class="modal-body">
    <p class="modal-confirm">Are you sure you want to delete this comment?</p>
    <p class="modal-warning">
      This comment will be removed and displayed as [deleted].
    </p>
    <p class="modal-warning">
      You will not be able to change this.
    </p>
  </div>

  <div
    id="error"
    *ngIf="errorStatusAlert"
    class="alert alert-danger alert-dismissible"
  >
    <a href="#" class="close" data-dismiss="alert" aria-label="close"
      >&times;</a
    >
    <small class="error" data-dismiss=".alert">{{ this.errorResult }}</small>
  </div>

  <div class="modal-footer">
    <div class="form-group">
      <button
        type="button"
        class="btn btn-outline-primary"
        (click)="closeModal()"
      >
        <span> Cancel </span>
      </button>
    </div>

    <div class="form-group">
      <button
        type="button"
        class="btn btn-danger"
        (click)="onDelete()"
      >
        <span> Delete </span>
      </button>
    </div>
  </div>
</div>
