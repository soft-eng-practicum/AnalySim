<td class="list-group-item d-flex h-100">
  <div class="mr-auto" *ngIf="notebook.type!=='folder'" style="width: 100%">
    <i class="fa fa-file mr-1"></i>
    <a style="margin-right: 5px; cursor: pointer;"
      (click)="navigateToNotebook()">{{notebook.name+notebook.extension}}</a>
    <select [(ngModel)]="selectedVersion" (ngModelChange)="onVersionChange($event)"
      *ngIf="notebook.type!=='observable'">
      <option *ngFor="let version of versions" [value]="version">v{{ version }}</option>
    </select>
    <div class="btn-group mr-3" role="group" style="float: right">
      <button type="button" class="btn btn-secondary" data-toggle="modal"
        [attr.data-target]="'#deleteModal' + notebook.notebookID">
        <i class="fa fa-trash mr-1"></i>
      </button>
      <button type="button" class="btn btn-secondary" (click)="downloadNotebook()" *ngIf="notebook.type!=='observable'">
        <i class="fa fa-arrow-down mr-1"></i>
      </button>
      <button type="button" class="btn btn-secondary" (click)="openObservableNotebook()"
        *ngIf="notebook.type==='observable'">
        <i class="fa fa-link mr-1"></i>
      </button>
    </div>
  </div>
</td>

<!--Delete NoteBook Modal-->
<div class="modal fade" [id]="'deleteModal' + notebook.notebookID" tabindex="-1" role="dialog"
  aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Delete Window</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div>Are you sure you want to delete this item ?</div>
        <div>
          <span *ngIf="notebook.type == 'new'">{{notebook.name}}{{notebook.extension}} version v{{selectedVersion}}
          </span>
          <span *ngIf="notebook.type == 'observable'">{{notebook.name}}{{notebook.extension}}</span>
          <span *ngIf="notebook.type == 'folder'">{{notebook.name}} folder</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-dismiss="modal">Close</button>
        <button type="button" class="btn" (click)="deleteNotebook()" data-dismiss="modal">Delete</button>
      </div>
    </div>
  </div>
</div>
