<div #notebookWindow class="modal-content"
    style="width: 100vw;height: 100vh;top: 0; left: 0;margin: 0;position: fixed; overflow: auto;">
    <div class="header">
        <h5 class="modal-title">Notebook</h5>
        <div class="notebook-actions">
            <button type="button" class="commit" *ngIf="notebook.type === 'new'"
                [disabled]="commitChangesLoading" (click)="commitTrackedFiles()">
                {{ commitChangesLoading ? 'Committing...' : 'Commit' }}
            </button>
            <label class="auto-commit-toggle" *ngIf="notebook.type === 'new'">
                <input type="checkbox" [checked]="autoCommitAfterClose"
                    (change)="onAutoCommitAfterCloseChange($any($event.target).checked)">
                <span>Commit on Close</span>
            </label>
            <span class="commit-status" *ngIf="commitStatusMessage">{{ commitStatusMessage }}</span>
            <button type="button" #closebutton class="close" data-dismiss="modal"
                (click)="closeNotebook()">&times;</button>
        </div>
    </div>
    <div id="jupyterlite-container" *ngIf="notebook.type === 'new'">
        <div *ngIf="isLoading" class="spinner-container">
            <div class="spinner-border" role="status">
            </div>
            <div>Loading Notebook...</div>
        </div>
        <iframe #jupyterFrame [src]="jupyterFrameSrc" width="100%" style="height: 100vh;"></iframe>
    </div>
    <div #observablehqPanel class="m-3" *ngIf="notebook.type === 'observable'">
        <div id="notebook"></div>
    </div>
</div>
